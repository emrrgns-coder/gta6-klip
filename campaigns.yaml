# ===================================================================
#  KAMPANYA KURALLARI  (Content Rewards / Whop)
#  Her kural kampanya sayfasından birebir alındı (19 Kasım 2026).
#  Bot, bir klip bu kurallardan birine uymazsa o klibi HİÇ üretmez.
# ===================================================================

defaults:
  language: en                 # altyazı ve yazılar İngilizce
  whisper_model: small.en
  min_clip_views: 15           # Twitch'te izleyicilerin kestiği klip en az bu kadar izlenmiş olsun
  max_clips_per_run: 3         # her çalışmada kampanya başına en fazla klip
  clip_lead_seconds: 1         # an başlamadan 1 sn önce başla (ilk 1-2 sn'de hook)
  clip_tail_seconds: 4
  min_seconds: 15
  max_seconds: 58              # Shorts sınırı
  game: "Grand Theft Auto VI"

campaigns:

  # ---------------------------------------------------------------
  - id: yourrage
    active: true
    name: "YourRAGE"
    twitch: yourragegaming
    submit_url: "https://contentrewards.com/c/campaigns/be9b123e-ea47-4305-b6c5-af81f503b247"
    rules_url: "https://reachclipping.com/yourRAGE"
    payout: "Havuz 5.000$ - tüm kliplerin toplamı 500.000 izlenmeyi geçmeli"
    start_date: "2026-11-19"   # GTA 6 maratonu
    end_date: null             # maraton bitince (Content Rewards'ta 'ended' görünür)
    must_mention_name: "Rage"  # açıklama/yazıda Rage'in adı geçmeli
    hashtags: ["#yourrage", "#GTA6"]
    caption_text: ""
    logo_overlay: null         # KURAL: hiçbir logo olmayacak
    allow_logos: false
    forbid_links: false
    submit_within_minutes: 30
    platforms: ["YouTube Shorts", "TikTok", "Instagram Reels"]

