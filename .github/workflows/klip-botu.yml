name: GTA 6 Klip Botu

on:
  schedule:
    - cron: "23 */2 * * *"    # 2 saatte bir (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: klip-botu
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: ffmpeg kur (hazir paket)
        uses: FedericoCarboni/setup-ffmpeg@v3
        timeout-minutes: 5

      - name: Yazi tipi kur
        timeout-minutes: 3
        continue-on-error: true
        run: sudo apt-get install -y -qq --no-install-recommends fonts-liberation

      - name: Python paketleri
        run: pip install -U -r requirements.txt

      - name: Altyazi modelini onbellekten al
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-en-v1

      - name: Klipleri uret
        timeout-minutes: 60
        run: python clipper.py

      - name: Klipleri Releases sayfasina koy
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(output/*.mp4)
          if [ ${#files[@]} -eq 0 ]; then echo "yeni klip yok"; exit 0; fi
          tag="klipler-${{ github.run_number }}"
          mv output/klipler.json "output/bilgi-${{ github.run_number }}.json"
          gh release create "$tag" output/*.mp4 "output/bilgi-${{ github.run_number }}.json" \
            --title "Yeni klipler #${{ github.run_number }}" \
            --notes "Paylasilmayi bekleyen klipler. Basliklar ve aciklamalar bilgi dosyasinda."

      - name: Klipleri yukleme klasorune koy (klipler dali)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "klip-botu"
          git config --global user.email "klip-botu@users.noreply.github.com"
          if git fetch origin klipler:klipler 2>/dev/null; then
            git worktree add /tmp/kb klipler
          else
            git worktree add --orphan -b klipler /tmp/kb
          fi
          mkdir -p /tmp/kb/bekleyen
          touch /tmp/kb/yuklendi.txt
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            gh release download "$tag" -p '*.mp4' -p '*.json' -D /tmp/kb/bekleyen --skip-existing || true
          done
          # yuklenmis olanlari klasorden cikar (yuklendi.txt'de yazanlar)
          while read -r f; do [ -n "$f" ] && rm -f "/tmp/kb/bekleyen/$f"; done < /tmp/kb/yuklendi.txt
          cd /tmp/kb && git add -A && { git commit -m "klipler guncellendi" && git push origin klipler; } || echo "degisiklik yok"

      - name: Islenenleri kaydet
        if: always()
        run: |
          git config --global user.name "klip-botu"
          git config --global user.email "klip-botu@users.noreply.github.com"
          git add state.json
          git commit -m "durum guncellendi" || { echo "degisiklik yok"; exit 0; }
          git pull --rebase origin main && git push origin HEAD:main
